// 重置视图 / 初始 fit
function fit(){
  setTimeout(function(){
    var b = gRoot.node().getBBox();
    if(!b.width) return;
    var s = Math.min(W/b.width, H/b.height)*0.85;
    s = Math.max(0.1, Math.min(s, 2));

}
